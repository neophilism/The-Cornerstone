name: engineering-kit
on:
  push:
    branches: [cornerstone/engineering-kit]
    paths: [.github/workflows/engineering-kit.yml]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e1ca0d8d70aefafce23fe46f309fbc31cc2cac27
          persist-credentials: false
      - name: Package exact tracked source only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e1ca0d8d70aefafce23fe46f309fbc31cc2cac27
          mkdir -p /tmp/cornerstone-source
          git archive --format=tar HEAD | gzip -n > /tmp/cornerstone-source/source.tar.gz
          git rev-parse HEAD > /tmp/cornerstone-source/COMMIT
          git rev-parse 'HEAD^{tree}' > /tmp/cornerstone-source/TREE
          cd /tmp/cornerstone-source
          sha256sum source.tar.gz COMMIT TREE > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: claim-survival-source
          path: /tmp/cornerstone-source
          retention-days: 1
          if-no-files-found: error
