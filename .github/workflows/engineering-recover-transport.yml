name: recover-exact-activity-transport
on:
  push:
    branches: [cornerstone/engineering-kit]
    paths: [.github/workflows/engineering-recover-transport.yml]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Recover exact checksummed input and use guarded application
        env:
          TRANSPORT_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, textwrap
          path = pathlib.Path('engineering/edits.json')
          original = path.read_bytes()
          pathlib.Path('/tmp/transport-wire.json').write_bytes(original)
          assert subprocess.check_output(['git', 'hash-object', str(path)]).decode().strip() == '6ee25498629e12090cb4842dfe0fbbd06b60585d'
          wire = json.loads(original)
          for old, new in [('AyfwYPe1sZtE6', 'AyfwYPe1vZtE6'), ('Exydje+pa3bMxzucun', 'Exydje+pa3swzucun')]:
              assert wire['payload'].count(old) == 1
              wire['payload'] = wire['payload'].replace(old, new, 1)
          raw = gzip.decompress(base64.b64decode(wire['payload'], validate=True))
          assert hashlib.sha256(raw).hexdigest() == wire['payloadSha256'] == '7fbed7db415e289a95cdc90b9ea0bfde811c4f8949266223e02c167dd413c7f5'
          request = json.loads(raw)
          assert request['target'] == 'cornerstone/activity-pages'
          assert request['base'] == 'fdf142a4093d905a326edbe27a74e0a6124c19f5'
          pathlib.Path('/tmp/repaired-transport.json').write_text(json.dumps(wire))
          workflow = pathlib.Path('.github/workflows/engineering-edits.yml')
          assert subprocess.check_output(['git', 'hash-object', str(workflow)]).decode().strip() == 'd8c490e647486aa8120b003baf8ff83ac7f0d354'
          code = textwrap.dedent(workflow.read_text().split("python3 - <<'PY'\n", 1)[1].split('\n          PY\n', 1)[0])
          needle = "pathlib.Path('engineering/edits.json').read_bytes()"
          assert code.count(needle) == 1
          code = code.replace(needle, "pathlib.Path('/tmp/repaired-transport.json').read_bytes()", 1)
          os.environ['GIT_TERMINAL_PROMPT'] = '0'
          os.environ['GIT_CONFIG_COUNT'] = '1'
          os.environ['GIT_CONFIG_KEY_0'] = 'http.https://github.com/.extraheader'
          os.environ['GIT_CONFIG_VALUE_0'] = 'AUTHORIZATION: basic ' + base64.b64encode(('x-access-token:' + os.environ['TRANSPORT_TOKEN']).encode()).decode()
          exec(compile(code, 'guarded-engineering-edits', 'exec'), {})
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: activity-transport-result
          path: |
            /tmp/transport-wire.json
            /tmp/change-result.json
          retention-days: 1
          if-no-files-found: error
