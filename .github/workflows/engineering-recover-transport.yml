name: recover-exact-reminder-transport
on:
  push:
    branches: [cornerstone/engineering-kit]
    paths: [.github/workflows/engineering-recover-transport.yml]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify known reminder bytes before correcting transport metadata
        env:
          TRANSPORT_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, textwrap
          path = pathlib.Path('engineering/edits.json')
          assert subprocess.check_output(['git', 'hash-object', str(path)]).decode().strip() == '4320adea52d6d91117e2d53283b2c7ce259e75ec'
          request = json.loads(path.read_bytes())
          assert request['target'] == 'cornerstone/personal-reminders'
          assert request['base'] == '01aa1568f0f782a0f2c98d6be178fc6a772929ce'
          rows = [c for c in request['changes'] if c['path'] == 'packages/ui/src/reminder.tsx']
          assert len(rows) == 1
          change = rows[0]
          assert change['beforeSha256'] is None
          assert change['afterSha256'] == '3655bcf0b43457e61b983980519fa955751651b7cda8b220aeb9aef5b56128e5'
          assert hashlib.sha256(change['content'].encode()).hexdigest() == 'efe18c2db13a074d0477d741d076eed8ae287cce0f8fdfa6b3093416406c95af'
          change['afterSha256'] = 'efe18c2db13a074d0477d741d076eed8ae287cce0f8fdfa6b3093416406c95af'
          pathlib.Path('/tmp/repaired-transport.json').write_text(json.dumps(request))
          workflow = pathlib.Path('.github/workflows/engineering-edits.yml')
          assert subprocess.check_output(['git', 'hash-object', str(workflow)]).decode().strip() == 'f4761b3ce0df2bed9a1ddf1f50db63fa1e3dcf25'
          code = textwrap.dedent(workflow.read_text().split("python3 - <<'PY'\n", 1)[1].split('\n          PY\n', 1)[0])
          needle = "pathlib.Path('engineering/edits.json').read_bytes()"
          assert code.count(needle) == 1
          code = code.replace(needle, "pathlib.Path('/tmp/repaired-transport.json').read_bytes()", 1)
          needle = "commit = api('/git/commits',"
          assert code.count(needle) == 1
          code = code.replace(needle, "assert tree['sha'] == '8db2c92fd03b56278f67cb3a0b0749c052109a6f', 'Exact local tree mismatch'\n" + needle, 1)
          exec(compile(code, 'guarded-engineering-edits', 'exec'), {})
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reminder-transport-result
          path: /tmp/change-result.json
          retention-days: 1
          if-no-files-found: error
