name: engineering-postgres
on:
  push:
    branches: [cornerstone/engineering-kit]
    paths: [.github/workflows/engineering-postgres.yml]
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Export the unstarted test image without data or credentials
        run: |
          set -euo pipefail
          mkdir -p /tmp/postgres-kit/root
          docker pull postgis/postgis:18-3.6
          docker image inspect postgis/postgis:18-3.6 --format '{{json .RepoDigests}}' > /tmp/postgres-kit/IMAGE.json
          instance=$(docker create postgis/postgis:18-3.6)
          docker export "$instance" | tar -xf - -C /tmp/postgres-kit/root
          docker rm "$instance"
          tar --exclude='*.woff' --exclude='*.woff2' --exclude='*.ttf' --exclude='*.otf' -czf /tmp/postgres-kit/postgres-root.tar.gz -C /tmp/postgres-kit/root .
          cd /tmp/postgres-kit
          sha256sum postgres-root.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: isolated-postgres-toolchain
          path: |
            /tmp/postgres-kit/postgres-root.tar.gz
            /tmp/postgres-kit/IMAGE.json
            /tmp/postgres-kit/SHA256SUMS
          retention-days: 1
          compression-level: 0
