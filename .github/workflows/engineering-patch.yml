name: engineering-patch
on:
  push:
    branches: [cornerstone/engineering-kit]
    paths: [engineering/patch.json]
permissions:
  contents: write
concurrency:
  group: engineering-patch
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Apply only the exact reviewed patch to its unchanged feature base
        env:
          TRANSPORT_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, io, json, os, pathlib, re, subprocess, urllib.request
          request = json.loads(pathlib.Path('engineering/patch.json').read_text())
          target, base = request['target'], request['base']
          assert re.fullmatch(r'cornerstone/[a-z0-9-]+', target)
          assert target not in ('cornerstone/engineering-kit', 'cornerstone/application')
          assert re.fullmatch(r'[a-f0-9]{40}', base)
          assert re.fullmatch(r'[a-f0-9]{64}', request['sha256'])
          assert 0 < len(request['message']) <= 200
          compressed = base64.b64decode(request['patch'], validate=True)
          assert len(compressed) < 2000000
          with gzip.GzipFile(fileobj=io.BytesIO(compressed)) as stream:
              patch = stream.read(5000001)
          assert 0 < len(patch) <= 5000000
          assert hashlib.sha256(patch).hexdigest() == request['sha256']
          def api(path, data=None, method=None):
              req = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + path,
                  data=None if data is None else json.dumps(data).encode(), method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['TRANSPORT_TOKEN'],
                      'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          assert api('/git/ref/heads/' + target)['object']['sha'] == base, 'Feature base changed'
          subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', base], check=True)
          subprocess.run(['git', 'checkout', '--detach', base], check=True)
          subprocess.run(['git', 'apply', '--cached', '--check', '--whitespace=error-all', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '--whitespace=error-all', '-'], input=patch, check=True)
          names = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().strip('\0').split('\0')
          assert sorted(names) == sorted(request['paths']) and 0 < len(names) <= 100
          assert not subprocess.check_output(['git', 'diff', '--cached', '--name-only', '--diff-filter=DRCTUXB'])
          elements = []
          for name in names:
              assert re.fullmatch(r'[A-Za-z0-9_./\[\]-]+', name) and '..' not in name.split('/')
              assert name.startswith(('apps/', 'packages/', 'tests/', 'docs/', 'db/', 'scripts/', 'registry/')) or name in ('README.md', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'vitest.config.ts', 'playwright.config.ts', 'playwright.private.config.ts', '.env.example')
              assert '/AGENTS.md' not in name and '/.env' not in name and name != 'registry/roadmap.json'
              mode = subprocess.check_output(['git', 'ls-files', '--stage', '--', name]).decode().split()[0]
              assert mode == '100644', 'Only regular non-executable source files accepted'
              content = pathlib.Path(name).read_bytes()
              assert len(content) <= 1000000 and b'\0' not in content
              elements.append({'path': name, 'mode': '100644', 'type': 'blob', 'content': content.decode('utf-8')})
          parent = api('/git/commits/' + base)
          tree = api('/git/trees', {'base_tree': parent['tree']['sha'], 'tree': elements})
          commit = api('/git/commits', {'message': request['message'], 'tree': tree['sha'], 'parents': [base]})
          assert api('/git/ref/heads/' + target)['object']['sha'] == base, 'Feature base changed before write'
          api('/git/refs/heads/' + target, {'sha': commit['sha'], 'force': False}, 'PATCH')
          result = {'branch': target, 'base': base, 'commit': commit['sha'], 'tree': tree['sha'], 'patchSha256': request['sha256'], 'paths': names}
          pathlib.Path('/tmp/change-result.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: feature-patch-result
          path: /tmp/change-result.json
          retention-days: 1
