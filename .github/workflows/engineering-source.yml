name: engineering-source
on:
  push:
    branches: [cornerstone/engineering-kit]
    paths: [.github/workflows/engineering-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e467b5dffe17f212443409490eb33d5e5c326ae6
          persist-credentials: false
      - name: Export tracked public source at its exact commit
        run: |
          set -euo pipefail
          mkdir -p /tmp/cornerstone-source
          git archive --format=tar HEAD | gzip > /tmp/cornerstone-source/source.tar.gz
          git rev-parse HEAD > /tmp/cornerstone-source/COMMIT
          git rev-parse HEAD^{tree} > /tmp/cornerstone-source/TREE
          cd /tmp/cornerstone-source
          sha256sum source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: exact-feature-source
          path: /tmp/cornerstone-source
          retention-days: 1
          compression-level: 0
