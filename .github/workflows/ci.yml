name: application-checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    if: github.event_name == 'pull_request' && github.head_ref == 'cornerstone/application' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: node scripts/preview-smoke.mjs
        env:
          EXPECTED_PREVIEW_COMMIT: ${{ github.event.pull_request.head.sha }}
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:boundaries
      - run: pnpm check:secrets
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:proxy
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: node --import tsx tests/worker-process.integration.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-verification
          path: test-results/
          retention-days: 7
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
        env:
          POSTGRES_DB: cornerstone_test
          POSTGRES_USER: cornerstone_migration
          POSTGRES_PASSWORD: synthetic_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cornerstone_migration -d cornerstone_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgresql://cornerstone_migration:synthetic_ci_only@localhost:5432/cornerstone_test
      DATABASE_URL: postgresql://cornerstone_runtime:synthetic_ci_runtime_only@localhost:5432/cornerstone_test
      WORKER_DATABASE_URL: postgresql://cornerstone_worker:synthetic_ci_worker_only@localhost:5432/cornerstone_test
      DATA_REALM: simulation
      CORNERSTONE_MODE: simulation
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: node --import tsx scripts/create-runtime-role.ts
      - run: pnpm db:migrate
      - run: node --import tsx tests/migrations.integration.ts
      - run: node --import tsx tests/runtime-schema.integration.ts
      - run: pnpm db:seed:simulation
      - run: node scripts/test-field-key.mjs
      - run: pnpm test:db
      - run: node --import tsx tests/draft-recovery.integration.ts
      - run: node --import tsx tests/creation.integration.ts
      - run: node --import tsx tests/activity.integration.ts
      - run: node --import tsx tests/worker-drain.integration.ts
      - run: node --import tsx tests/activity-pages.integration.ts
      - run: node --import tsx tests/identity-access.integration.ts
      - run: node --import tsx tests/evidence.integration.ts
      - run: node --import tsx tests/membership.integration.ts
      - run: node --import tsx tests/succession.integration.ts
      - run: node --import tsx tests/claim-survival.integration.ts
      - run: node --import tsx tests/governance.integration.ts
      - run: node --import tsx tests/compact.integration.ts
      - run: node --import tsx tests/association-scale.integration.ts
      - run: node --import tsx tests/record-pages.integration.ts
      - run: node --import tsx tests/record-export.integration.ts
      - run: node --import tsx tests/financial-journey.integration.ts
      - run: pnpm -r --filter @cornerstone/api --filter @cornerstone/portal --filter @cornerstone/staff --filter @cornerstone/worker build
        env:
          NODE_ENV: production
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:private --project=desktop --output=test-results/desktop
      - run: pnpm test:private --project=mobile --output=test-results/mobile
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: private-browser-verification
          path: test-results/
          retention-days: 7
