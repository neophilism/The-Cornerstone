name: engineering-edits
on:
  push:
    branches: [cornerstone/engineering-kit]
    paths: [engineering/edits.json]
permissions:
  contents: write
concurrency:
  group: engineering-edits
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Preserve the exact base and verify each readable edit
        env:
          TRANSPORT_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re, subprocess, urllib.request, zlib
          wire = pathlib.Path('engineering/edits.json').read_bytes()
          assert len(wire) <= 5000000
          request = json.loads(wire)
          if 'compression' in request:
              assert set(request) == {'compression', 'payloadSha256', 'payload'}
              assert request['compression'] == 'gzip-base64'
              assert re.fullmatch(r'[a-f0-9]{64}', request['payloadSha256'])
              compressed = base64.b64decode(request['payload'], validate=True)
              assert len(compressed) <= 1000000
              decoder = zlib.decompressobj(16 + zlib.MAX_WBITS)
              expanded = decoder.decompress(compressed, 5000001)
              assert len(expanded) <= 5000000 and decoder.eof and not decoder.unconsumed_tail and not decoder.unused_data
              assert hashlib.sha256(expanded).hexdigest() == request['payloadSha256']
              request = json.loads(expanded)
          target, base = request['target'], request['base']
          assert re.fullmatch(r'cornerstone/[a-z0-9-]+', target)
          assert target not in ('cornerstone/engineering-kit', 'cornerstone/application')
          assert re.fullmatch(r'[a-f0-9]{40}', base)
          assert 0 < len(request['message']) <= 200
          assert 0 < len(request['changes']) <= 100
          def api(path, data=None, method=None):
              req = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + path,
                  data=None if data is None else json.dumps(data).encode(), method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['TRANSPORT_TOKEN'],
                      'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          assert api('/git/ref/heads/' + target)['object']['sha'] == base, 'Feature base changed'
          subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', base], check=True)
          subprocess.run(['git', 'checkout', '--detach', base], check=True)
          elements, names, total = [], set(), 0
          for change in request['changes']:
              name = change['path']
              assert re.fullmatch(r'[A-Za-z0-9_./\[\]-]+', name) and '..' not in name.split('/')
              assert name not in names
              names.add(name)
              assert name.startswith(('apps/', 'packages/', 'tests/', 'docs/', 'db/', 'scripts/', 'registry/')) or name in ('README.md', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'vitest.config.ts', 'playwright.config.ts', 'playwright.private.config.ts', '.env.example', '.github/workflows/ci.yml')
              assert '/AGENTS.md' not in name and '/.env' not in name and name != 'registry/roadmap.json'
              path = pathlib.Path(name)
              if change['beforeSha256'] is None:
                  assert not path.exists() and not path.is_symlink()
                  content = change['content']
              else:
                  assert not name.startswith('db/'), 'Applied migration files are immutable'
                  assert path.is_file() and not path.is_symlink()
                  mode = subprocess.check_output(['git', 'ls-files', '--stage', '--', name]).decode().split()[0]
                  assert mode == '100644'
                  raw = path.read_bytes()
                  assert hashlib.sha256(raw).hexdigest() == change['beforeSha256'], 'Source mismatch: ' + name
                  content = raw.decode('utf-8')
                  if 'content' in change:
                      content = change['content']
                  else:
                      for edit in change['edits']:
                          assert edit['find'] and content.count(edit['find']) == 1, 'Ambiguous edit: ' + name
                          content = content.replace(edit['find'], edit['replace'], 1)
              raw = content.encode('utf-8')
              assert len(raw) <= 1000000 and b'\0' not in raw
              total += len(raw)
              assert total <= 5000000
              assert hashlib.sha256(raw).hexdigest() == change['afterSha256'], 'Result mismatch: ' + name
              elements.append({'path': name, 'mode': '100644', 'type': 'blob', 'content': content})
          parent = api('/git/commits/' + base)
          tree = api('/git/trees', {'base_tree': parent['tree']['sha'], 'tree': elements})
          commit = api('/git/commits', {'message': request['message'], 'tree': tree['sha'], 'parents': [base]})
          assert api('/git/ref/heads/' + target)['object']['sha'] == base, 'Feature base changed before write'
          api('/git/refs/heads/' + target, {'sha': commit['sha'], 'force': False}, 'PATCH')
          result = {'branch': target, 'base': base, 'commit': commit['sha'], 'tree': tree['sha'], 'paths': sorted(names)}
          pathlib.Path('/tmp/change-result.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: feature-edit-result
          path: /tmp/change-result.json
          retention-days: 1
